<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>냉장고 레시피</title>
  <meta name="description" content="집에 있는 재료만으로 만들 수 있는 쉽고 빠른 레시피를 찾아드려요.">
  <link rel="canonical" href="https://ljy100879-boop.github.io/fridge-recipe/">
  <!-- 카카오톡·SNS 공유 미리보기. 이미지 원본은 scripts/og-image.html -->

  <meta property="og:site_name" content="냉장고 레시피">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:url" content="https://ljy100879-boop.github.io/fridge-recipe/">
  <meta property="og:title" content="냉장고 레시피 — 있는 재료로, 지금 바로">
  <meta property="og:description" content="집에 있는 재료만 넣으면 쉽고 빠른 요리를 먼저 찾아드려요. 회원가입 없이 바로 사용하세요.">
  <meta property="og:image" content="https://ljy100879-boop.github.io/fridge-recipe/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="냉장고 레시피 — 있는 재료로, 지금 바로.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#f26b3a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="냉장고 레시피">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="site-header">
    <h1 class="logo"><span aria-hidden="true">🧊</span> 냉장고 레시피</h1>
    <p class="tagline">있는 재료로, 지금 바로.</p>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <section class="panel seasoning-panel" aria-labelledby="seasoning-title">
        <button type="button" class="panel-toggle" id="seasoning-toggle" aria-expanded="true" aria-controls="seasoning-body">
          <span class="step-badge" aria-hidden="true">1</span>
          <span id="seasoning-title" class="panel-title">집에 있는 조미료</span>
          <span class="seasoning-count" id="seasoning-count"></span>
          <span class="chevron" aria-hidden="true"></span>
        </button>
        <div class="panel-body" id="seasoning-body">
          <p class="hint" id="seasoning-hint">체크한 조미료는 부족한 재료로 세지 않아요. 한 번만 설정하면 다음에도 기억해요.</p>
          <button type="button" class="btn btn-soft" id="select-basic">기본 조미료 전체 선택</button>
          <div id="seasoning-groups"></div>
          <form class="custom-seasoning" id="custom-seasoning-form" autocomplete="off">
            <label class="sr-only" for="custom-seasoning-input">직접 추가할 조미료</label>
            <input type="text" id="custom-seasoning-input" placeholder="목록에 없는 조미료" maxlength="20">
            <button type="submit" class="btn btn-ghost">+ 직접 추가</button>
          </form>
        </div>
      </section>

      <section class="panel ingredient-panel" id="ingredient-panel" aria-labelledby="ingredient-title">
        <div class="panel-head">
          <h2 class="panel-heading">
            <span class="step-badge" aria-hidden="true">2</span>
            <span id="ingredient-title" class="panel-title">냉장고 재료</span>
          </h2>
          <button type="button" class="text-btn" id="clear-inputs" hidden>전체 지우기</button>
        </div>
        <ul class="chip-list input-chips" id="input-chips" aria-label="입력한 재료"></ul>
        <p class="pin-hint" id="pin-hint" hidden>📌를 누르면 그 재료를 <strong>꼭 쓰는</strong> 레시피만 보여요.</p>
        <div class="combobox">
          <label class="sr-only" for="ingredient-input">재료 입력</label>
          <input type="text" id="ingredient-input" placeholder="재료 입력 (예: 계란, 양파)" autocomplete="off"
                 role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions" enterkeyhint="done">
          <ul class="suggestions" id="suggestions" role="listbox" aria-label="재료 추천" hidden></ul>
        </div>
        <div class="quick-add" aria-label="자주 쓰는 재료 빠른 추가">
          <span class="quick-label">빠른 추가</span>
          <div class="quick-chips" id="quick-chips"></div>
        </div>
      </section>
    </aside>

    <main class="results" id="results" aria-live="polite">
      <div class="view-tabs" id="view-tabs" role="group" aria-label="보기 전환">
        <button type="button" class="view-tab" data-view="search" aria-pressed="true">레시피 찾기</button>
        <button type="button" class="view-tab" data-view="favorites" aria-pressed="false">♥ 즐겨찾기 <span class="count" id="fav-count"></span></button>
      </div>
      <div class="toolbar" id="toolbar" hidden>
        <div class="control-group" role="group" aria-label="정렬">
          <span class="control-label">정렬</span>
          <div class="segmented" id="sort-control"></div>
        </div>
        <div class="control-group" role="group" aria-label="조리시간 필터">
          <span class="control-label">시간</span>
          <div class="segmented" id="time-filter"></div>
        </div>
        <div class="control-group" role="group" aria-label="난이도 필터">
          <span class="control-label">난이도</span>
          <div class="segmented" id="difficulty-filter"></div>
        </div>
        <div class="control-group" role="group" aria-label="식사 유형 필터">
          <span class="control-label">유형</span>
          <div class="segmented" id="meal-filter"></div>
        </div>
      </div>
      <div id="result-groups"></div>
    </main>
  </div>

  <div class="detail-backdrop" id="detail-backdrop" hidden></div>
  <aside class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden></aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
